[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlmath"
version = "0.1.0"
description = "Thư viện các phương pháp toán học cho Máy học tự cài đặt bằng Python/NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
